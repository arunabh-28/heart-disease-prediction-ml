<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Heart Disease Prediction</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f7fb;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 850px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .heart {
        font-size: 50px;
        margin-bottom: 10px;
      }

      h1 {
        color: #222;
        font-size: 32px;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #777;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
      }

      input,
      select {
        padding: 12px;
        border: 1px solid #d5dbe3;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #e63946;
      }

      .full-width {
        grid-column: span 2;
      }

      .predict-btn {
        width: 100%;
        margin-top: 30px;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #e63946;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
      }

      .predict-btn:hover {
        background: #c92f3c;
      }

      .result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
      }

      .high-risk {
        background: #ffe5e5;
        color: #c62828;
      }

      .low-risk {
        background: #e6f7ed;
        color: #218838;
      }

      .error {
        background: #fff0f0;
        color: #d32f2f;
      }

      .probability {
        text-align: center;
        margin-top: 10px;
        color: #555;
      }

      .confidence-card {
        margin-top: 18px;
        padding: 18px;
        background: #f8fafc;
        border: 1px solid #e1e7ef;
        border-radius: 12px;
        text-align: center;
      }

      .confidence-title {
        font-size: 15px;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
      }

      .confidence-value {
        font-size: 30px;
        font-weight: bold;
        color: #e63946;
        margin-bottom: 12px;
      }

      .confidence-bar {
        width: 100%;
        height: 12px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
      }

      .confidence-fill {
        height: 100%;
        background: #e63946;
        border-radius: 20px;
        transition: width 0.4s ease;
      }

      .confidence-text {
        margin-top: 10px;
        color: #777;
        font-size: 13px;
      }

      .note {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin-top: 25px;
      }

      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: span 1;
        }

        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->

      <div class="header">
        <div class="heart">❤️</div>

        <h1>Heart Disease Prediction</h1>

        <p class="subtitle">
          Enter patient details to estimate heart disease risk.
        </p>
      </div>

      <!-- FORM -->

      <form action="/predict" method="POST">
        <div class="form-grid">
          <!-- AGE -->

          <div class="form-group">
            <label> Age </label>

            <input
              type="number"
              name="age"
              min="18"
              max="100"
              value="40"
              required
            />
          </div>

          <!-- SEX -->

          <div class="form-group">
            <label> Sex </label>

            <select name="sex" required>
              <option value="M">Male</option>

              <option value="F">Female</option>
            </select>
          </div>

          <!-- CHEST PAIN -->

          <div class="form-group">
            <label> Chest Pain Type </label>

            <select name="chest_pain" required>
              <option value="ATA">ATA</option>

              <option value="NAP">NAP</option>

              <option value="TA">TA</option>

              <option value="ASY">ASY</option>
            </select>
          </div>

          <!-- BLOOD PRESSURE -->

          <div class="form-group">
            <label> Resting Blood Pressure (mm Hg) </label>

            <input
              type="number"
              name="resting_bp"
              min="80"
              max="200"
              value="120"
              required
            />
          </div>

          <!-- CHOLESTEROL -->

          <div class="form-group">
            <label> Cholesterol (mg/dL) </label>

            <input
              type="number"
              name="cholesterol"
              min="100"
              max="600"
              value="200"
              required
            />
          </div>

          <!-- FASTING BS -->

          <div class="form-group">
            <label> Fasting Blood Sugar > 120 mg/dL </label>

            <select name="fasting_bs" required>
              <option value="0">No</option>

              <option value="1">Yes</option>
            </select>
          </div>

          <!-- ECG -->

          <div class="form-group">
            <label> Resting ECG </label>

            <select name="resting_ecg" required>
              <option value="Normal">Normal</option>

              <option value="ST">ST</option>

              <option value="LVH">LVH</option>
            </select>
          </div>

          <!-- MAX HR -->

          <div class="form-group">
            <label> Maximum Heart Rate </label>

            <input
              type="number"
              name="max_hr"
              min="60"
              max="220"
              value="150"
              required
            />
          </div>

          <!-- EXERCISE ANGINA -->

          <div class="form-group">
            <label> Exercise-Induced Angina </label>

            <select name="exercise_angina" required>
              <option value="Y">Yes</option>

              <option value="N">No</option>
            </select>
          </div>

          <!-- OLDPEAK -->

          <div class="form-group">
            <label> Oldpeak </label>

            <input
              type="number"
              name="oldpeak"
              min="0"
              max="6"
              step="0.1"
              value="1.0"
              required
            />
          </div>

          <!-- ST SLOPE -->

          <div class="form-group full-width">
            <label> ST Slope </label>

            <select name="st_slope" required>
              <option value="Up">Up</option>

              <option value="Flat">Flat</option>

              <option value="Down">Down</option>
            </select>
          </div>
        </div>

        <!-- PREDICT BUTTON -->

        <button type="submit" class="predict-btn">
          🔍 Predict Heart Disease Risk
        </button>
      </form>

      <!-- RESULT -->

      {% if result %}

      <div class="result {{ result_class }}">{{ result }}</div>

      {% if confidence is not none %}

      
          Based on the {{ neighbor_count }} nearest training samples.
        </div>
      </div>

      {% endif %} {% endif %}

     
    </div>
  </body>
</html>
